# Panel de edición de la web de Costa Musical (Sveltia CMS)
# Repositorio: github.com/costa-musical/web-costa-musical
backend:
  name: github
  repo: costa-musical/web-costa-musical
  branch: main
  # Inicio de sesión con GitHub a través de la propia web (functions/api/*.js en Cloudflare Pages)
  base_url: https://costamusical.pages.dev
  auth_endpoint: api/auth

locale: es
media_folder: img/subidas
public_folder: /img/subidas

# Las fotos que se suben desde el panel se reducen solas antes de guardarse:
# se pasan a WebP (formato ligero que entienden todos los navegadores) y a 2000 px como máximo.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

collections:
  - name: contenido
    label: Contenido de la web
    editor:
      preview: false
    files:

      - name: agenda
        label: Agenda (conciertos y actuaciones)
        file: content/agenda.json
        fields:
          - name: eventos
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            label: Eventos
            label_singular: evento
            widget: list
            summary: "{{fields.fecha}} · {{fields.titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: fecha, label: Fecha, widget: datetime, type: date, format: "YYYY-MM-DD", hint: "Si aún no sabes el día exacto, pon el día 1 del mes y escribe abajo el texto que quieres que se vea." }
              - name: tipo
                label: Tipo
                widget: select
                default: concierto
                hint: "Cada tipo sale con su color en la agenda."
                options:
                  - { label: Concierto, value: concierto }
                  - { label: "Procesión", value: procesion }
                  - { label: "Pasacalles / desfile", value: pasacalles }
                  - { label: "Otro (festival, encuentro, acto…)", value: otro }
              - { name: fecha_texto, label: "Texto de fecha (opcional)", widget: string, required: false, hint: "Por ejemplo «Nov» o «21–28». Si lo dejas vacío se muestra el día." }
              - name: agrupacion
                label: Agrupación
                widget: select
                options:
                  - { label: Banda, value: banda }
                  - { label: Orquesta, value: orquesta }
                  - { label: Big Band, value: big-band }
                  - { label: Charanga, value: charanga }
                  - { label: Música de cámara, value: camara }
              - { name: hora, label: "Hora (opcional)", widget: string, required: false, hint: "Por ejemplo 20:30" }
              - { name: lugar, label: "Lugar (opcional)", widget: string, required: false }
              - { name: descripcion, label: "Descripción corta", widget: text, required: false, hint: "Sale en la tarjeta de la agenda y arriba en la página del evento." }
              - { name: cartel, label: "Cartel (opcional)", widget: image, required: false }
              - { name: texto, label: "Texto completo (opcional)", widget: text, required: false, hint: "Para la página del evento: director, solistas, colaboradores, historia del concierto… Deja una línea en blanco entre párrafos." }
              - { name: gratis, label: "Entrada libre", widget: boolean, default: true }
              - { name: precio, label: "Precio (si no es gratis)", widget: string, required: false, hint: "Por ejemplo «8 € · niños gratis»" }
              - { name: entradas_url, label: "Enlace para comprar entradas", widget: string, required: false, hint: "El enlace de la plataforma de venta. Aparecerá un botón «Comprar entradas»." }
              - name: programa
                collapsed: true
                label: "Programa (opcional)"
                widget: list
                required: false
                summary: "{{fields.obra}}"
                fields:
                  - { name: obra, label: Obra, widget: string }
                  - { name: autor, label: "Autor / arreglista", widget: string, required: false }
              - { name: director, label: "Dirección (programa de mano)", widget: string, required: false, hint: "Si lo dejas vacío, se usa el director actual de la agrupación." }
              - { name: solistas, label: "Solistas o colaboradores (opcional)", widget: string, required: false }
              - { name: texto_folleto, label: "Texto para el programa de mano (opcional)", widget: text, required: false, hint: "Si lo dejas vacío, se usa el texto completo del evento. Ponlo más corto si no cabe en la hoja." }
              - { name: agradecimientos, label: "Agradecimientos (programa de mano)", widget: text, required: false }
              - { name: video, label: "Vídeo de YouTube (opcional)", widget: string, required: false, hint: "Un adelanto o, cuando ya se haya celebrado, la grabación." }
              - name: fotos
                label: "Fotos del evento"
                widget: image
                multiple: true
                required: false
                hint: "Puedes seleccionar todas las fotos de una carpeta a la vez (Ctrl+A o Cmd+A) o arrastrarlas de golpe. El evento aparece solo como álbum en la Galería."
              - name: album
                label: "…o enlazar un álbum que ya existe en la galería (opcional)"
                widget: relation
                collection: contenido
                file: galeria
                value_field: "albumes.*.id"
                search_fields: ["albumes.*.titulo"]
                display_fields: ["albumes.*.titulo"]
                required: false
                hint: "Si eliges un álbum, las fotos de arriba se suman a él."
              - name: apoyos
                collapsed: true
                label: "Patrocinadores / colaboradores (este evento)"
                label_singular: patrocinador
                widget: list
                required: false
                summary: "{{fields.nombre}}"
                fields:
                  - { name: nombre, label: Nombre, widget: string }
                  - { name: logo, label: "Logo", widget: image, required: false, hint: "Mejor PNG con fondo transparente." }
                  - { name: web, label: "Web (opcional)", widget: string, required: false, hint: "Con https://, por ejemplo https://www.puntaumbria.es" }
              - name: organizadores
                collapsed: true
                label: "Organizan (programa de mano, opcional)"
                label_singular: organizador
                widget: list
                required: false
                hint: "Déjalo vacío para usar los organizadores habituales de Ajustes. Rellénalo solo si este evento lo organiza otra gente."
                summary: "{{fields.nombre}}"
                fields:
                  - { name: nombre, label: Nombre, widget: string }
                  - { name: logo, label: "Logo", widget: image, required: false, hint: "PNG o WebP con fondo transparente. Si lo dejas vacío sale el nombre en texto." }
              - { name: mapa_url, label: "Enlace al mapa (opcional)", widget: string, required: false, hint: "Si lo dejas vacío, el botón «Cómo llegar» busca el lugar en Google Maps." }

      - name: noticias
        label: Noticias
        file: content/noticias.json
        fields:
          - name: noticias
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            label: Noticias
            label_singular: noticia
            widget: list
            summary: "{{fields.fecha}} · {{fields.titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: id, label: "Dirección corta", widget: string, hint: "Sin espacios ni tildes, por ejemplo concierto-santa-cecilia. Se usa en el enlace." }
              - { name: fecha, label: Fecha, widget: datetime, type: date, format: "YYYY-MM-DD" }
              - { name: foto, label: Foto, widget: image, required: false }
              - { name: resumen, label: "Resumen (una o dos frases)", widget: text }
              - { name: texto, label: "Texto completo", widget: text, hint: "Deja una línea en blanco entre párrafos." }

      - name: historia
        label: Nuestra historia
        file: content/historia.json
        fields:
          - { name: titulo, label: "Título", widget: string }
          - { name: entradilla, label: Entradilla, widget: text }
          - name: hitos
            collapsed: true
            label: "Línea del tiempo"
            label_singular: hito
            widget: list
            summary: "{{fields.anio}} · {{fields.titulo}}"
            hint: "Ordénalos del más antiguo al más reciente arrastrándolos."
            fields:
              - { name: anio, label: "Año (o periodo)", widget: string, hint: "Por ejemplo 1996 o 2006–2012" }
              - { name: titulo, label: "Título", widget: string }
              - { name: texto, label: Texto, widget: text, required: false }
              - { name: imagen, label: "Foto (opcional)", widget: image, required: false, hint: "Si no pones foto y eliges un álbum, se usa la portada del álbum." }
              - name: album
                label: "Álbum de la galería (opcional)"
                widget: relation
                collection: contenido
                file: galeria
                value_field: "albumes.*.id"
                search_fields: ["albumes.*.titulo"]
                display_fields: ["albumes.*.titulo"]
                required: false
          - name: directores
            collapsed: true
            label: Directores de la banda
            label_singular: director
            widget: list
            summary: "{{fields.nombre}} ({{fields.periodo}})"
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: periodo, label: Periodo, widget: string }
          - { name: cierre, label: "Texto final (llamada a antiguos músicos)", widget: text, required: false }

      - name: cursos
        label: Cursos e inscripciones
        file: content/cursos.json
        fields:
          - name: cursos
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            label: Cursos
            label_singular: curso
            widget: list
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: Nombre del curso, widget: string }
              - { name: id, label: "Dirección corta", widget: string, hint: "Sin espacios ni tildes, por ejemplo curso-verano-2027. Para una nueva edición, crea un curso nuevo con otra dirección (trumpet-academy-2027)." }
              - { name: tipo, label: Tipo, widget: select, options: ["Curso de verano", "Durante el curso", "Clase magistral", "Encuentro"] }
              - name: inscripcion
                label: Inscripción
                widget: select
                default: proximamente
                hint: "Cuando pasa la última fecha del curso (o la fecha límite), la inscripción se cierra sola y el curso pasa a «Ediciones anteriores»."
                options:
                  - { label: "Abierta (muestra el formulario)", value: abierta }
                  - { label: "Próximamente (aún no se puede apuntar)", value: proximamente }
                  - { label: "Plazas agotadas", value: completa }
              - { name: fecha_limite, label: "Fecha límite de inscripción (opcional)", widget: datetime, type: date, format: "YYYY-MM-DD", required: false }
              - { name: resumen, label: "Resumen (una frase)", widget: string }
              - { name: descripcion, label: Descripción, widget: text, hint: "Deja una línea en blanco entre párrafos." }
              - name: especialidades
                label: "Especialidades (instrumentos)"
                label_singular: especialidad
                widget: list
                required: false
                hint: "Si pones más de una, en la inscripción aparece un desplegable para elegir. Si lo dejas vacío, se pregunta el instrumento con texto libre."
                field: { name: especialidad, label: Especialidad, widget: string }
              - name: encuentros
                collapsed: true
                label: "Fechas / encuentros"
                label_singular: encuentro
                widget: list
                required: false
                summary: "{{fields.fecha}} {{fields.titulo}}"
                hint: "Añade una entrada por cada fecha o encuentro. Un curso de verano suele tener una (con fecha de fin); una academia anual, varias."
                fields:
                  - { name: fecha, label: "Día (o primer día)", widget: datetime, type: date, format: "YYYY-MM-DD" }
                  - { name: fecha_fin, label: "Último día (si dura varios días)", widget: datetime, type: date, format: "YYYY-MM-DD", required: false }
                  - { name: titulo, label: "Nombre (opcional)", widget: string, required: false, hint: "Por ejemplo «Primer encuentro» o «Clase magistral con…»." }
                  - { name: horario, label: "Horario (opcional)", widget: string, required: false }
                  - { name: lugar, label: "Lugar, si cambia (opcional)", widget: string, required: false }
                  - name: profesores
                    label: "Profesorado de este encuentro (opcional)"
                    label_singular: profesor
                    widget: list
                    required: false
                    hint: "Escribe cada nombre igual que en la lista de Profesorado de abajo, así se muestra también su especialidad."
                    field: { name: nombre, label: Nombre, widget: string }
                  - { name: cartel, label: "Cartel de este encuentro (opcional)", widget: image, required: false }
              - { name: encuentros_sueltos, label: "Permitir apuntarse a encuentros sueltos", widget: boolean, default: false, required: false, hint: "Si lo activas y hay varios encuentros, el formulario deja marcar a cuáles se apunta cada alumno." }
              - { name: fechas, label: "Fechas en texto (solo si aún no hay encuentros con fecha)", widget: string, required: false, hint: "Por ejemplo «Julio de 2027». Si añades encuentros, se usan ellos y esto se ignora." }
              - { name: lugar, label: Lugar, widget: string, required: false }
              - { name: dirigido, label: "Dirigido a", widget: string, required: false }
              - { name: precio, label: Precio, widget: string, required: false }
              - { name: plazas, label: Plazas, widget: string, required: false }
              - { name: foto, label: Foto, widget: image, required: false }
              - name: profesorado
                collapsed: true
                label: Profesorado
                widget: list
                required: false
                summary: "{{fields.nombre}} ({{fields.especialidad}})"
                fields:
                  - { name: nombre, label: Nombre, widget: string }
                  - { name: especialidad, label: "Especialidad (instrumento)", widget: string, required: false, hint: "Por ejemplo Trompeta. Si el curso no tiene especialidades puestas arriba, el formulario usa las del profesorado." }
                  - { name: descripcion, label: "Breve currículum", widget: text, required: false }
                  - { name: foto, label: "Foto (opcional)", widget: image, required: false }
              - { name: enlace_pago, label: "Enlace de pago (opcional)", widget: string, required: false, hint: "Si lo pones, al enviar la inscripción aparece un botón «Pagar inscripción» con este enlace (por ejemplo, un enlace de pago de Stripe)." }

      - name: galeria
        label: Galería (fotos y vídeos)
        file: content/galeria.json
        fields:
          - name: albumes
            collapsed: true
            minimize_collapsed: true
            add_to_top: true
            label: Álbumes
            label_singular: álbum
            widget: list
            summary: "{{fields.fecha}} · {{fields.titulo}}"
            fields:
              - { name: titulo, label: Título, widget: string, hint: "Por ejemplo «Concierto de Santa Cecilia 2026» o «Curso de dirección 2024»." }
              - { name: id, label: "Dirección corta", widget: string, hint: "Sin espacios ni tildes, por ejemplo santa-cecilia-2026. Se usa en el enlace." }
              - { name: fecha, label: Fecha, widget: datetime, type: date, format: "YYYY-MM-DD", hint: "Si no sabes el día exacto, pon el 1 de enero de ese año." }
              - name: categoria
                label: Tipo
                widget: select
                options: [Conciertos, Certámenes, Procesiones, Pasacalles, Festival de Bandas, Cursos, Eventos]
              - { name: descripcion, label: "Descripción corta", widget: text, required: false }
              - { name: portada, label: "Foto de portada del álbum", widget: image, required: false, hint: "Si la dejas vacía se usa la primera foto o el primer vídeo." }
              - name: fotos
                collapsed: true
                label: Fotos
                label_singular: foto
                widget: list
                required: false
                summary: "{{fields.pie}}"
                fields:
                  - { name: imagen, label: Foto, widget: image, hint: "Mejor fotos de menos de 1 MB (unos 2000 px de ancho)." }
                  - { name: pie, label: "Pie de foto (opcional)", widget: string, required: false }
              - name: fotos_lote
                label: "Añadir muchas fotos de golpe"
                widget: image
                multiple: true
                required: false
                hint: "Selecciona todas las fotos de una carpeta a la vez (Ctrl+A o Cmd+A) o arrástralas. Se muestran después de las fotos con pie."
              - name: videos
                collapsed: true
                label: "Vídeos de YouTube"
                label_singular: vídeo
                widget: list
                required: false
                summary: "{{fields.titulo}}"
                fields:
                  - { name: url, label: "Enlace de YouTube", widget: string, hint: "Copia el enlace del vídeo desde YouTube (Compartir → Copiar enlace)." }
                  - { name: titulo, label: "Título (opcional)", widget: string, required: false }

      - name: inicio
        label: Página de inicio
        file: content/inicio.json
        fields:
          - { name: titular, label: "Titular (primera línea)", widget: string }
          - { name: titular_destacado, label: "Titular (línea en amarillo)", widget: string }
          - { name: entradilla, label: Entradilla, widget: text }
          - name: carrusel
            collapsed: true
            label: "Carrusel de fotos de portada"
            label_singular: foto
            widget: list
            summary: "{{fields.pie}}"
            fields:
              - { name: imagen, label: Foto, widget: image, hint: "Mejor fotos horizontales de menos de 1 MB." }
              - { name: pie, label: "Pie de foto (opcional)", widget: string, required: false }
          - { name: foto_portada, label: "Foto fija (solo si el carrusel está vacío)", widget: image, required: false }
          - { name: pie_foto, label: "Descripción de la foto", widget: string, required: false, hint: "Para personas que usan lector de pantalla." }
          - name: cinta
            label: "Cinta de portada (palabras con enlace)"
            widget: list
            summary: "{{fields.texto}} → {{fields.enlace}}"
            fields:
              - { name: texto, label: Palabra, widget: string }
              - { name: enlace, label: "Lleva a", widget: string, hint: "Por ejemplo agenda.html, cursos.html, contrataciones.html o galeria.html#categoria-eventos" }
          - name: testimonio
            label: "Cita de un músico"
            widget: object
            fields:
              - { name: texto, label: Frase, widget: text, required: false, hint: "Si la dejas vacía se muestra «¿Tocas algo? Te estamos buscando»." }
              - { name: nombre, label: Nombre, widget: string, required: false }
              - { name: instrumento, label: Instrumento, widget: string, required: false }
              - { name: desde, label: "En la banda desde (año)", widget: string, required: false }
          - name: colaboradores
            collapsed: true
            label: "Patrocinadores y colaboradores"
            label_singular: patrocinador
            widget: list
            summary: "{{fields.nombre}}"
            hint: "Salen en la portada y, con logo, al pie de todas las páginas."
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: logo, label: "Logo", widget: image, required: false, hint: "Mejor PNG con fondo transparente." }
              - { name: web, label: "Web (opcional)", widget: string, required: false, hint: "Con https://. Al pulsar el logo se abre su web." }
              - { name: detalle, label: "Detalle (opcional)", widget: string, required: false, hint: "Por ejemplo «Patrocinador de la Big Band» o «Institución colaboradora»." }

      - name: agrupaciones
        label: Agrupaciones
        file: content/agrupaciones.json
        fields:
          - name: agrupaciones
            collapsed: true
            label: Agrupaciones
            label_singular: agrupación
            widget: list
            summary: "{{fields.nombre}} ({{fields.estado}})"
            fields:
              - { name: id, label: "Identificador", widget: string, hint: "No lo cambies una vez creado: lo usan la agenda y los enlaces." }
              - { name: nombre, label: "Nombre completo", widget: string }
              - { name: corto, label: "Nombre corto", widget: string }
              - { name: estado, label: Estado, widget: select, options: [{ label: Activa, value: activa }, { label: En proyecto, value: proyecto }] }
              - { name: color, label: Color, widget: color }
              - { name: etiqueta, label: "Etiqueta (p. ej. «Desde 1996»)", widget: string }
              - { name: lema, label: "Frase de presentación", widget: text }
              - { name: foto, label: Foto, widget: image, required: false }
              - { name: descripcion, label: "Quiénes somos", widget: text }
              - { name: formacion, label: Formación, widget: string, required: false }
              - { name: direccion, label: Dirección, widget: string, required: false }
              - { name: repertorio, label: Repertorio, widget: string, required: false }
              - { name: ensayos, label: Ensayos, widget: string, required: false }
              - name: cifras
                label: "Cifras destacadas"
                widget: list
                required: false
                fields:
                  - { name: valor, label: Valor, widget: string }
                  - { name: texto, label: Texto, widget: string }
              - name: historia
                label: Historia
                widget: list
                required: false
                fields:
                  - { name: anio, label: Año, widget: string }
                  - { name: texto, label: Texto, widget: string }
              - name: directores
                collapsed: true
                label: Directores
                widget: list
                required: false
                fields:
                  - { name: periodo, label: Periodo, widget: string }
                  - { name: nombre, label: Nombre, widget: string }
              - { name: buscamos, label: "Instrumentos que buscamos", widget: list, field: { name: instrumento, label: Instrumento, widget: string }, hint: "Escribe cada instrumento igual en todas las agrupaciones para que el buscador de «Únete» los junte." }
              - { name: servicio, label: "Para qué se puede contratar", widget: string }

      - name: contrataciones
        label: Contrataciones (recomendador)
        file: content/contrataciones.json
        fields:
          - name: actos
            collapsed: true
            label: "Tipos de acto"
            widget: list
            fields:
              - { name: nombre, label: "Tipo de acto", widget: string }
              - { name: recomendacion, label: "Formación recomendada", widget: string }
              - { name: explicacion, label: "Por qué", widget: string }

      - name: ajustes
        label: Ajustes y contacto
        file: content/ajustes.json
        fields:
          - { name: nombre, label: "Nombre de la entidad", widget: string }
          - name: organizadores
            collapsed: true
            label: "Organizadores habituales (programas de mano)"
            label_singular: organizador
            widget: list
            required: false
            hint: "Salen en el bloque «Organizan» de la contraportada. Para la asociación usa el logo /img/logo.png: se pinta la lira con su nombre."
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: Nombre, widget: string }
              - { name: logo, label: "Logo", widget: image, required: false }
          - { name: web_url, label: "Dirección de la web", widget: string, required: false, hint: "La que sale en el QR de los programas de mano. Por defecto https://costamusical.pages.dev (cámbiala cuando tengamos dominio propio)." }
          - { name: correo, label: Correo, widget: string, required: false }
          - { name: telefono, label: Teléfono, widget: string, required: false }
          - { name: instagram, label: "Instagram (con @)", widget: string, required: false }
          - { name: tiktok, label: "TikTok (con @)", widget: string, required: false }
          - { name: mostrar_tiktok, label: "Mostrar los vídeos de TikTok en Portada y Noticias", widget: boolean, default: true, required: false }
          - { name: canal_whatsapp, label: "Enlace del canal de WhatsApp (opcional)", widget: string, required: false, hint: "En WhatsApp: Novedades → tu canal → Compartir enlace. Si lo rellenas, aparece «Síguenos en WhatsApp» en la portada y en el pie." }
          - { name: boletin_url, label: "Enlace para apuntarse a la lista de correo (opcional)", widget: string, required: false }
          - { name: youtube, label: "YouTube (con @)", widget: string, required: false }
          - { name: facebook, label: "Facebook (enlace)", widget: string, required: false }
          - { name: cif, label: CIF, widget: string, required: false }
          - { name: formularios_clave, label: "Clave de formularios (Web3Forms)", hint: "La clave que llega al correo de la asociación desde web3forms.com. Sin ella los formularios no envían.", widget: string, required: false }
          - { name: lugar_ensayos, label: "Lugar de ensayos", widget: string }
          - { name: cuota_socio, label: "Cuota anual de socio (€)", widget: string, required: false, hint: "Pon 0 si hacerse socio es gratis." }
